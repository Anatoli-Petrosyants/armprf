<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ARMPRF">
  <!-- Armenian tricolour in the federation's own brand values, so the tab icon
       reads at 16px and still matches the wordmark. -->
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="170.67" y="0" fill="#ED1A38"/>
    <rect width="512" height="170.67" y="170.67" fill="#1E4389"/>
    <rect width="512" height="170.67" y="341.33" fill="#F78F1E"/>
  </g>
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#00000022" stroke-width="8"/>
</svg>
